name: MAX Editor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Node
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
